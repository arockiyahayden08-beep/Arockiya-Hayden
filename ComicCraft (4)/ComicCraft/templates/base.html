<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ComicCraft{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">🦊 ComicCraft</a>
    <span class="tagline">Turn an idea into a cartoon comic</span>
  </header>
  <main class="page">{% block content %}{% endblock %}</main>
  <footer class="footer">ComicCraft · FastAPI · Gemini · Hugging Face</footer>
  <script src="/static/js/app.js"></script>
</body>
</html>
